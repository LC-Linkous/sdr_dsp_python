# Publish sdr_dsp to PyPI when a version tag is pushed, or by hand.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Manual runs (Actions -> release -> Run workflow) take a ref and a `publish`
# switch. With `publish` off (the default) the run is a REHEARSAL on any ref
# -- `main`, a branch, a SHA: it runs every guard below, builds, twine-checks
# and uploads the wheel + sdist as a workflow artifact, and stops. Nothing
# reaches PyPI. With `publish` on, the ref must be an existing v* tag that
# matches pyproject; it then makes the same release the tag push would have
# (use it to retry a failed publish, or to release deliberately rather than on
# push).
#
# What it guards:
#   * the tag must equal the version in sdr_dsp/pyproject.toml (a v0.3.1 tag on
#     a 0.3.0 tree is refused before anything is built);
#   * the suite, ruff and mypy run once more on the tagged commit -- tags are
#     cut from a green main, but this is the commit that ships;
#   * the built wheel and sdist pass `twine check` (PyPI's own metadata rules)
#     and contain only the package (no sample_data/, examples/, tools/).
#
# How it authenticates: PyPI "trusted publishing" (OIDC). There is no API
# token anywhere in this repo or its secrets. ONE-TIME SETUP on pypi.org,
# before the first tag: Your projects -> Publishing -> add a pending publisher
# with owner LC-Linkous, repository sdr_dsp_python, workflow release.yml,
# environment pypi. docs/RELEASING.md has the full checklist.
#
# The two jobs are split so the `pypi` environment (which you can protect with
# a required reviewer in repo Settings -> Environments) only wraps the publish
# step, not the tests.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build: a branch or SHA for a rehearsal, a v* tag to publish"
        required: false
        default: main
        type: string
      publish:
        description: "Publish to PyPI + GitHub release (requires a v* tag ref; off = rehearsal)"
        required: false
        default: false
        type: boolean

env:
  # The ref under release: the pushed tag, or whatever the manual form said.
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  # Publishing happens on a tag push, or on a manual run that asked for it.
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

permissions:
  contents: read

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdr_dsp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdr_dsp/uv.lock

      - name: Ref is publishable (tag matches pyproject version)
        run: |
          set -e
          ver="$(uv run --no-project --python 3.12 python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "ref=$RELEASE_REF pyproject=$ver publish=$PUBLISH commit=$(git rev-parse --short HEAD)"
          case "$RELEASE_REF" in
            v[0-9]*)
              test "${RELEASE_REF#v}" = "$ver" || { echo "::error::tag $RELEASE_REF does not match pyproject version $ver"; exit 1; } ;;
            *)
              if [ "$PUBLISH" = "true" ]; then
                echo "::error::publish requires a v* tag ref, got '$RELEASE_REF'"; exit 1
              fi
              echo "::notice::rehearsal on '$RELEASE_REF' (not a tag): building $ver, publishing nothing" ;;
          esac

      - name: Sync (locked)
        run: uv sync --locked --python 3.12

      - name: Suite, ruff, mypy, handbook on the tagged commit
        run: |
          uv run pytest -q
          uv run ruff check . ../docs/dev_handbook
          uv run mypy
          uv run python ../docs/dev_handbook/generate_api_handbook.py --check ../docs/dev_handbook/sdr_dsp_API_HANDBOOK.md

      - name: Build wheel and sdist
        run: uv build

      - name: Artifacts contain the package only
        run: |
          set -e
          uv run --with twine twine check dist/*
          # anything outside src/, LICENSE*, README.md, pyproject.toml, PKG-INFO is a packaging regression
          bad="$(tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' | grep -Ev '^(src(/|$)|LICENSE|README\.md$|pyproject\.toml$|PKG-INFO$)' || true)"
          if [ -n "$bad" ]; then echo "::error::unexpected files in sdist:"; echo "$bad"; exit 1; fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdr_dsp/dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    # A tag push always publishes; a manual run only when asked (and the
    # build job has already refused publish=true on a non-tag ref).
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sdr-dsp/
    permissions:
      id-token: write      # trusted publishing
      contents: write      # attach the artifacts to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: dist/*
          generate_release_notes: false
          body: |
            `pip install sdr-dsp` -- what changed is in
            [CHANGELOG.md](https://github.com/LC-Linkous/sdr_dsp_python/blob/main/CHANGELOG.md).
